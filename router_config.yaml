# Multi-mode router config for the research engine.
#
# Two-stage routing:
#   1. RULE-BASED match (this file) — deterministic, free, fast.
#   2. HAIKU FALLBACK — only when no rule matches the query.
#
# Worker model is also routed per Model Law v3 (2026-05-08):
#   - Logic Engine work     → Codex
#   - Architect / Wisdom    → Opus
#   - Creative / Writer     → Sonnet
#   - Researcher / Speed    → Haiku
#
# All lanes referenced here MUST be defined in the `lanes:` registry below.
# Authority weights are 0.0–1.0; reranker multiplies result scores by them.

schema_version: "1.0.0"

# ---------------------------------------------------------------------------
# Routing rules — first match wins. Order matters (most specific first).
# ---------------------------------------------------------------------------

rules:

  # --- Government / Legal / Regulatory ---
  - name: gov_tech_transfer
    patterns: [nasa software, patent license, spinoff, tech transfer, commercialize, dual-use technology, government technology, defense open source]
    lanes: [nasa_techtransfer, github_code, searxng_general, exa_direct]
    worker_model: haiku
    topic: gov_tech

  - name: federal_court_ruling
    patterns: [court ruling, supreme court, circuit court, appellate, scotus, opinion]
    lanes: [courtlistener, congress_gov, searxng_general, paid_proxy]
    worker_model: haiku
    topic: legal
    require_tier_1: true

  - name: sec_filing
    patterns: [10-k, 10-q, 8-k, sec filing, edgar, form s-1, proxy statement]
    lanes: [sec_edgar, sec_gov, searxng_general, exa_direct]
    worker_model: haiku
    topic: finance_filings
    require_tier_1: true

  - name: campaign_finance
    patterns: [campaign finance, fec, super pac, independent expenditure]
    lanes: [fec_gov, openstates, congress_gov, searxng_general, exa_direct]
    worker_model: haiku
    topic: politics

  - name: legislation
    patterns: [bill, congress, senate, house, statute, h.r., s.b., legislation]
    lanes: [congress_gov, openstates, govinfo_gov, searxng_general, exa_direct]
    worker_model: haiku
    topic: politics

  - name: state_legislation
    patterns: [state senate, state assembly, governor, state law]
    lanes: [openstates, searxng_general, paid_proxy]
    worker_model: haiku
    topic: politics

  # --- Academic / Research ---
  - name: academic_paper
    patterns: [arxiv, paper, study, peer-reviewed, journal, doi, et al]
    lanes: [arxiv, semantic_scholar, core, papers_with_code, searxng_general, exa_direct]
    worker_model: haiku
    topic: academic
    require_tier_1: true

  - name: medical_research
    patterns: [clinical trial, nih, pubmed, fda, peer-reviewed, randomized, cohort]
    lanes: [pubmed, semantic_scholar, fda_gov, nih_gov, searxng_general, exa_direct, linkup_direct]
    worker_model: haiku
    topic: medicine
    require_tier_1: true

  - name: ml_sota
    patterns: [state of the art, sota, benchmark, leaderboard, ablation]
    lanes: [papers_with_code, hn_algolia, github_code, gitlab_code, codeberg_code, hf_hub, semantic_scholar, exa_direct]
    worker_model: haiku
    topic: ml_ai

  # --- Code / Engineering ---
  - name: code_pattern
    patterns: [how to, library, function, sdk, api, code example, implementation]
    lanes: [github_code, gitlab_code, codeberg_code, sourcehut_code, sourcegraph, stack_exchange, hn_algolia, searxng_general, firecrawl_direct]
    worker_model: codex_5_4
    topic: code

  - name: error_diagnosis
    patterns: [error, exception, traceback, bug, "doesn't work", segfault, panic]
    lanes: [stack_exchange, github_code, gitlab_code, codeberg_code, sourcegraph, searxng_general, exa_direct]
    worker_model: codex_5_4
    topic: code

  # --- Real-time / Social ---
  - name: breaking_news
    patterns: [today, breaking, just announced, this morning, last hour]
    lanes: [x_pulse, bluesky_jetstream, hn_algolia, searxng_general, tavily_direct, firecrawl_direct, paid_proxy]
    worker_model: haiku
    topic: news
    freshness_max_age_hours: 24

  - name: social_sentiment
    patterns: [reddit, twitter, x.com, what people think, community reaction]
    lanes: [reddit_rss, x_pulse, bluesky_jetstream, hn_algolia, searxng_forums, youcom_direct]
    worker_model: haiku
    topic: social

  - name: counter_evidence_focused
    patterns: [counter, "what's wrong with", failures, banned, debunked, lawsuit against]
    lanes: [searxng_forums, reddit_failures, hn_algolia, paid_proxy, courtlistener]
    worker_model: haiku
    topic: any
    bias: counter_evidence

  # --- Datasets / AI artifacts ---
  - name: dataset_lookup
    patterns: [dataset, training data, csv, parquet, kaggle dataset]
    lanes: [kaggle, hf_datasets, searxng_general, exa_direct]
    worker_model: haiku
    topic: datasets

  - name: model_lookup
    patterns: [model card, fine-tune, checkpoint, weights, gguf, mlx model]
    lanes: [hf_hub, papers_with_code, github_code, gitlab_code, codeberg_code, searxng_general, exa_direct]
    worker_model: haiku
    topic: ml_ai

  # --- Personal / Memory ---
  - name: memory_recall
    patterns: [check memory, did we discuss, what do i know about, have i seen]
    lanes: [mentor_memory, claude_memory_files, obsidian, exa_direct]
    worker_model: haiku
    topic: personal
    skip_web: true

  # --- General fallback (lowest priority) ---
  - name: general_web
    patterns: [".*"]
    lanes: [searxng_general, linkup_direct, firecrawl_direct, paid_proxy]
    worker_model: haiku
    topic: general

# ---------------------------------------------------------------------------
# Lane registry — every lane referenced above must appear here.
# ---------------------------------------------------------------------------

lanes:

  # ------- Web search -------
  searxng_general:
    type: api
    endpoint: "http://localhost:8888/search?q={query}&format=json"
    auth: none
    cost_per_call_usd: 0.0
    rate_limit_qps: 5
    notes: "Default first lane. Free, local."

  searxng_forums:
    type: api
    endpoint: "http://localhost:8888/search?q={query}&format=json&engines=hackernews,stackoverflow,lemmy+posts,askubuntu,mastodon+hashtags"
    auth: none
    cost_per_call_usd: 0.0

  gemini_pro_scout:
    type: cli
    command: "{RESEARCH_ENGINE_AGY_BIN}"
    profile: "canonical-agy"
    model_candidates:
      - "Gemini 3.7 Flash (Medium)"
    auth: oauth_subscription
    cost_per_call_usd: 0.0
    notes: "Front scout lane for /research and /deep-research only. The canonical agy binary receives the exact friendly --model name. Skip Gemini probes when unattended or when the locked daily budget is exhausted."

  counter_evidence:
    type: cli
    command: "{RESEARCH_ENGINE_GROK_BIN}"
    model: "grok-4.5"
    auth: oauth_subscription
    cost_per_call_usd: 0.0
    notes: "Native Grok CLI lane for the counter-evidence worker."

  grok_x_search:
    type: cli
    command: "{RESEARCH_ENGINE_GROK_BIN}"
    model: "grok-4.5"
    auth: oauth_subscription
    cost_per_call_usd: 0.0
    notes: "X/Twitter search lane used by the business research sequence; defined in dispatcher.py."

  paid_proxy:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10}'
    auth: none_local
    cost_per_call_usd: 0.005
    notes: "Paid proxy fallback. Routes paid Linkup -> Tavily -> You.com, with free Exa (as of 2026-07-04) as backup. Free-first search should exhaust local/free lanes before this."

  linkup_direct:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10,"provider":"linkup"}'
    auth: none_local
    cost_per_call_usd: 0.005
    notes: "Direct Linkup via the proxy — uses next live linkup_* key."

  exa_direct:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10,"provider":"exa"}'
    auth: none_local
    cost_per_call_usd: 0.0
    notes: "Exa is FREE as of 2026-07-04 (Ian) via proxy exa_* keys and must NOT be reported as a paid burn. Do not confuse this with the free keyless mcp.exa.ai endpoint used by buzz."

  exa:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10,"provider":"exa"}'
    auth: none_local
    cost_per_call_usd: 0.0
    notes: "Compatibility alias for exa_direct. Exa is now free."

  youcom_direct:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10,"provider":"youcom"}'
    auth: none_local
    cost_per_call_usd: 0.005
    notes: "Direct You.com via the proxy — uses next live youcom_* key. Currently 4 keys all alive but never used in production."

  tavily_direct:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10,"provider":"tavily"}'
    auth: none_local
    cost_per_call_usd: 0.005
    notes: "Direct Tavily via the proxy — uses next live tavily_* key."

  firecrawl_direct:
    type: api
    endpoint: "http://localhost:18791/search"
    method: POST
    body_template: '{"query":"{query}","numResults":10,"provider":"firecrawl"}'
    auth: none_local
    cost_per_call_usd: 0.005
    notes: "Paid Firecrawl fallback via proxy firecrawl_* keys. Treat as last-resort paid credits, not a free lane."

  # ------- Government / legal -------
  courtlistener:
    type: api
    endpoint: "https://www.courtlistener.com/api/rest/v4/search/?q={query}"
    auth: optional_token
    cost_per_call_usd: 0.0
    notes: "CT already has bridge/courtlistener_ingest.py — reuse."

  nasa_techtransfer:
    type: api
    endpoint: "https://technology.nasa.gov/api/query/{stream}/{query}"
    auth: none
    cost_per_call_usd: 0.0
    notes: "NASA Tech Transfer patent/software/spinoff search. Stream chosen from query intent."

  dod_oss:
    type: api
    endpoint: "https://api.github.com/search/{resource}?q={q_clause}"
    auth: env:GITHUB_TOKEN
    headers:
      Authorization: "Bearer env:GITHUB_TOKEN"
    cost_per_call_usd: 0.0
    rate_limit_qps: 1
    notes: "DoD open-source on GitHub (deptofdefense org). Resource/repos vs code chosen from query intent."

  congress_gov:
    type: api
    endpoint: "https://api.congress.gov/v3/?api_key={DATA_GOV_API_KEY}&query={query}"
    auth: env:DATA_GOV_API_KEY
    cost_per_call_usd: 0.0
    notes: "ProPublica API died 2024. congress.gov is the live replacement."

  sec_edgar:
    type: api
    endpoint: "https://efts.sec.gov/LATEST/search-index?q={query}&forms=10-K,10-Q,8-K"
    auth: none
    cost_per_call_usd: 0.0

  sec_gov:
    type: scrape
    endpoint: "https://www.sec.gov/cgi-bin/srqsb?text={query}"
    auth: none

  fec_gov:
    type: api
    endpoint: "https://api.open.fec.gov/v1/?api_key={FEC_API_KEY}&q={query}"
    auth: env:FEC_API_KEY
    cost_per_call_usd: 0.0

  openstates:
    type: api
    endpoint: "https://v3.openstates.org/bills?q={query}&apikey={OPENSTATES_API_KEY}"
    auth: env:OPENSTATES_API_KEY
    cost_per_call_usd: 0.0

  govinfo_gov:
    type: api
    endpoint: "https://api.govinfo.gov/search?api_key={DATA_GOV_API_KEY}"
    method: POST
    body_template: '{"query":"{query}","pageSize":20,"offsetMark":"*"}'
    auth: env:DATA_GOV_API_KEY
    cost_per_call_usd: 0.0

  fda_gov:
    type: api
    endpoint: "https://api.fda.gov/drug/event.json?search={query}&api_key={FDA_API_KEY}"
    auth: env:FDA_API_KEY
    cost_per_call_usd: 0.0

  nih_gov:
    type: api
    endpoint: "https://api.reporter.nih.gov/v2/projects/search"
    method: POST
    body_template: '{"criteria":{"text_search":"{query}"}}'
    auth: none

  pubmed:
    type: api
    endpoint: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term={query}&retmode=json"
    auth: none
    cost_per_call_usd: 0.0

  # ------- Academic / research -------
  arxiv:
    type: api
    endpoint: "https://export.arxiv.org/api/query?search_query=all:{query}&max_results=20"
    auth: none
    cost_per_call_usd: 0.0

  semantic_scholar:
    type: api
    endpoint: "https://api.semanticscholar.org/graph/v1/paper/search?query={query}&limit=20"
    auth: optional_key
    cost_per_call_usd: 0.0

  core:
    type: api
    endpoint: "https://api.core.ac.uk/v3/search/works?q={query}&limit=20"
    auth: optional_key
    cost_per_call_usd: 0.0

  papers_with_code:
    type: api
    endpoint: "https://paperswithcode.com/api/v1/search/?q={query}"
    auth: none
    cost_per_call_usd: 0.0

  # ------- Code -------
  github_code:
    type: api
    endpoint: "https://api.github.com/search/code?q={query}"
    auth: env:GITHUB_TOKEN
    # headers is the operative auth field; auth stays as documentation.
    headers:
      Authorization: "Bearer env:GITHUB_TOKEN"
    cost_per_call_usd: 0.0
    rate_limit_qps: 1  # GitHub is strict

  sourcegraph:
    type: api
    endpoint: "https://sourcegraph.com/.api/search/stream?q={query}&display=10"
    auth: none
    cost_per_call_usd: 0.0
    notes: "Use when GitHub Code Search rate-limits."

  gitlab_code:
    type: api
    endpoint: "https://gitlab.com/api/v4/search?scope=projects&search={query}"
    auth: env:GITLAB_TOKEN
    # headers is the operative auth field; auth stays as documentation.
    headers:
      PRIVATE-TOKEN: "env:GITLAB_TOKEN"
    cost_per_call_usd: 0.0
    rate_limit_qps: 2
    notes: "GitLab.com global code (blob) search is disabled server-side (403); this lane uses global PROJECT (repo) search instead, which works with a read_api PAT in GITLAB_TOKEN."

  codeberg_code:
    type: api
    endpoint: "https://codeberg.org/api/v1/repos/search?q={query}&limit=20"
    auth: none
    cost_per_call_usd: 0.0
    rate_limit_qps: 5
    notes: "Codeberg (Forgejo) public repo search. No token required."

  sourcehut_code:
    type: api
    endpoint: "http://localhost:8888/search?q=site%3Asr.ht+{query}&format=json"
    auth: none
    cost_per_call_usd: 0.0
    notes: "SourceHut has no public global code-search API; routes a site:sr.ht query through local SearXNG (token-free). Authenticated repo/paste access uses the `hut` CLI."

  stack_exchange:
    type: api
    endpoint: "https://api.stackexchange.com/2.3/search/advanced?q={query}&site=stackoverflow"
    auth: optional_key
    cost_per_call_usd: 0.0

  # ------- AI hub / data -------
  hf_hub:
    type: mcp
    mcp_server: claude_ai_Hugging_Face
    notes: "Uses HuggingFace MCP (already configured)."

  hf_datasets:
    type: mcp
    mcp_server: claude_ai_Hugging_Face
    notes: "Same MCP, dataset search vs model search."

  kaggle:
    type: api
    endpoint: "https://www.kaggle.com/api/v1/datasets/list?search={query}"
    auth: file:~/.kaggle/kaggle.json
    cost_per_call_usd: 0.0

  # ------- Real-time social -------
  reddit_rss:
    type: api
    endpoint: "https://www.reddit.com/search.rss?q={query}&sort=relevance&limit=25"
    auth: none
    headers:
      User-Agent: "{RESEARCH_ENGINE_USER_AGENT}"
    cost_per_call_usd: 0.0
    response_format: atom

  # DEPRECATED 2026-06-19: JSON endpoint returns 403; use reddit_rss.
  reddit_json:
    type: api
    endpoint: "https://www.reddit.com/search.json?q={query}&t=week"
    auth: none
    headers:
      User-Agent: "{RESEARCH_ENGINE_USER_AGENT}"
    cost_per_call_usd: 0.0

  reddit_failures:
    type: api
    endpoint: "https://www.reddit.com/search.json?q={query}+failed+OR+broken+OR+banned&sort=relevance&t=month"
    auth: none
    headers:
      User-Agent: "{RESEARCH_ENGINE_USER_AGENT}"
    cost_per_call_usd: 0.0

  x_pulse:
    type: cli
    command: "~/bin/x-pulse-research"
    args: ["{query}"]
    cost_per_call_usd: 0.01  # Gemini-summarized; small
    notes: "Real-time X (~last hour). Faster than SearXNG twitter engine."

  bluesky_jetstream:
    type: cli
    command: "{RESEARCH_ENGINE_BUZZ_SCRIPT}"
    args: ["{query}", "--quick", "--emit=json", "--search=bluesky"]
    auth: none
    cost_per_call_usd: 0.0
    notes: "Compatibility lane name; uses buzz's working HTTP Bluesky search instead of the dead Jetstream websocket."

  hn_algolia:
    type: api
    endpoint: "https://hn.algolia.com/api/v1/search?query={query}&hitsPerPage=30"
    auth: none
    cost_per_call_usd: 0.0

  # ------- Personal / memory -------
  mentor_memory:
    type: local
    db_path: "{RESEARCH_ENGINE_MEMORY_DB}"
    env_var: "RESEARCH_ENGINE_MEMORY_DB"
    notes: "MENTOR memory; never call retired Brain API at port 18790."

  claude_memory_files:
    type: local
    glob: "{RESEARCH_ENGINE_CLAUDE_MEMORY_GLOB}"
    env_var: "RESEARCH_ENGINE_CLAUDE_MEMORY_GLOB"

  obsidian:
    type: local
    glob: "{RESEARCH_ENGINE_OBSIDIAN_GLOB}"
    env_var: "RESEARCH_ENGINE_OBSIDIAN_GLOB"

