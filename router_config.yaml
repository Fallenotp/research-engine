    "news.ycombinator.com": 0.65
    "bsky.app": 0.6
    "twitter.com": 0.5
    "x.com": 0.5

# ---------------------------------------------------------------------------
# Fail-safe policy — evidence score decisions use per-query decoy calibration.
# ---------------------------------------------------------------------------

failsafe:
  # If fewer than this fraction of candidate chunks clear the calibrated gate,
  # the protocol must abstain rather than synthesize a weak answer.
  min_pass_fraction: 0.25
  min_distinct_passing_sources: 2
  abstention_message: "Insufficient evidence — refine query or expand search."

# ---------------------------------------------------------------------------
# Gemini 3.7 Flash scout front stage.
# ---------------------------------------------------------------------------

scout:
  lane: gemini_pro_scout
  worker_model: gemini-flash
  provider: agy_cli
  cli_home: "{RESEARCH_ENGINE_AGY_BIN}"
  cli_profile: "canonical-agy"
  health_check_timeout_seconds: 60
  fail_loud: false
  discord_alert_channel: alerts
  discord_alert_channel_id: "1495166380163596298"
  # The dispatcher passes the exact friendly model name via --model. It skips
  # Gemini probes for unattended runs and when the locked daily cap is full.
  model_candidates:
    - "Gemini 3.7 Flash (Medium)"
  fallback_flag: "--pro-synthesis-fallback"

fleets:
  research:
    worker_count: 3
    scout_model: "Gemini 3.7 Flash (Medium)"
    scout_home: "{RESEARCH_ENGINE_AGY_BIN}"
    workers:
      - count: 1
        model: codex-5.4
        command_model: gpt-5.4-mini
      - count: 1
        model: mistral
        command_model: mistral-small-latest
        provider: mistral_free_api
        key_file: "{RESEARCH_ENGINE_MISTRAL_KEYS_FILE}"
      - count: 1
        model: grok
        command_model: grok-4.5
        provider: grok_cli
  deep_research:
    worker_count: 16
    scout_model: "Gemini 3.7 Flash (Medium)"
    scout_home: "{RESEARCH_ENGINE_AGY_BIN}"
    workers:
      - count: 5
        model: haiku
      - count: 5
        model: codex-5.4
        command_model: gpt-5.4-mini
      - count: 5
        model: haiku
      - count: 1
        model: grok
        command_model: grok-4.5
        provider: grok_cli

# ---------------------------------------------------------------------------
# Recursive planning tiers for /research and /deep-research.
# ---------------------------------------------------------------------------

recursion:
  distinct_llm_threshold_for_deep_tier: 3
  similarity_drop_threshold: 0.86
  research:
    deep:
      max_depth_below_scout: 2
      subquestions_per_node: 3
      leaf_search_cap: 12
      budget_ceiling_usd: 0.50
    one_llm:
      max_depth_below_scout: 0
      subquestions_per_node: 0
      leaf_search_cap: 4
      budget_ceiling_usd: 0.15
  deep_research:
    deep:
      max_depth_below_scout: 3
      subquestions_per_node: 4
      leaf_search_cap: 25
      budget_ceiling_usd: 1.50
    one_llm:
      max_depth_below_scout: 1
      subquestions_per_node: 2
      leaf_search_cap: 6
      budget_ceiling_usd: 0.30

# ---------------------------------------------------------------------------
# Cheap judge between reranker and final synthesis.
# ---------------------------------------------------------------------------

judge:
  worker_model: haiku
  require_crystal_check: true
  drop_off_topic: true

# ---------------------------------------------------------------------------
# Graduated answer thresholds.
# ---------------------------------------------------------------------------

graduated_answer:
  full_confidence_min: 0.70
  partial_confidence_min: 0.35
  abstain_confidence_below: 0.35

# ---------------------------------------------------------------------------
# Reranker (locked decision — do not change without new bakeoff).
# ---------------------------------------------------------------------------

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rationale: |
    Locked 2026-04-26. BAAI/bge-reranker-v2-m3 was 0.35% worse on NDCG@10
    (0.3930 vs 0.3944) and 5.8% slower (9251ms vs 8744ms) on a real
    32-query bakeoff. See project_handoff_20260426_2355_5f9ce078.md.
  blend_alpha: 0.7  # MENTOR_RERANK_BLEND_ALPHA — RRF / reranker blend
  device: cpu  # M4 ANE-friendly; no GPU required

# ---------------------------------------------------------------------------
# Worker LLM routing (per Model Law v3, 2026-05-08).
# ---------------------------------------------------------------------------

worker_routing:
  search_and_read: haiku  # MANDATORY for search/read/fetch
  synthesis_short: sonnet  # plain-English explainer
  synthesis_dense: opus  # find holes, redesign, push back
  long_document_pile: codex_5_3  # 1M-context reads
  code_oriented: codex_5_4  # default code worker
  hard_architecture: codex_5_5  # only when architecture is genuinely hard
  trivial_mechanical: codex_mini

# ---------------------------------------------------------------------------
# Iteration policy for /deep-research.
# ---------------------------------------------------------------------------

iteration:
  max_loops: 3
  trigger_on_gap_severities: [high, medium]
  per_iteration_lane_cap: 2  # don't fire all lanes again — be focused
  cost_cap_usd_per_session: 1.50  # matches /deep-research cost budget

# ---------------------------------------------------------------------------
# Proxy backend and fetch politeness for stealth reads.
# ---------------------------------------------------------------------------

proxy:
  backend: nordvpn
  min_interval_s: 2.0
  sticky_default: false
