    "fec.gov": 1.0
    "openstates.org": 1.0
    "govinfo.gov": 1.0
    "propublica.org": 0.9
    "politico.com": 0.8
    "reuters.com": 0.85
    "nytimes.com": 0.8

  medicine:
    "pubmed.ncbi.nlm.nih.gov": 1.0
